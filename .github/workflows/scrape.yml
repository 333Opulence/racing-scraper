name: Racing Data Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

jobs:
  daily-scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run daily scraper
        run: python daily_scraper.py
      
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: racing-results
          path: |
            racing_data_complete/*.csv
            daily_*.csv
          retention-days: 90
      
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: racing-logs
          path: *.log
          retention-days: 30
