name: Racing Scraper

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install requests
          pip install beautifulsoup4
      - name: Run scraper
        run: python scraper.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: racing-data
          path: races_*.csv
